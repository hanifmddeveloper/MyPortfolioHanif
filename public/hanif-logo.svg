<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2048 1024" fill="none" role="img" aria-labelledby="title">
  <title id="title">Hanif</title>
  <defs>
    <linearGradient id="letters" x1="280" y1="180" x2="1730" y2="860" gradientUnits="userSpaceOnUse">
      <stop stop-color="#05F2F2"/>
      <stop offset=".5" stop-color="#08BFEA"/>
      <stop offset="1" stop-color="#0872E8"/>
    </linearGradient>
    <filter id="glow" x="-10%" y="-20%" width="120%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <text x="1024" y="735" text-anchor="middle" fill="url(#letters)" stroke="#04DDF2" stroke-width="5" paint-order="stroke fill" font-family="Arial, Helvetica, sans-serif" font-size="650" font-weight="800" letter-spacing="-24" filter="url(#glow)">Hanif</text>
</svg>
